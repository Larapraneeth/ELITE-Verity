services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elite_verity}
      POSTGRES_USER: ${POSTGRES_USER:-elite_verity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v2/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: >
      sh -c "python -c 'from app.database import init_db; init_db()' &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-elite_verity}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}@postgres:5432/${POSTGRES_DB:-elite_verity}
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DOCUMENT_PROCESSING_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: >
      sh -c "python -c 'from app.database import init_db; init_db()' &&
      python -c 'from app.services.document_processing import run_worker; run_worker()'"
    environment:
      <<: *app_environment
      DOCUMENT_PROCESSING_ENABLED: "true"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy

  streamlit:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      <<: *app_environment
    ports:
      - "8501:8501"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      chroma:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  uploads_data:
